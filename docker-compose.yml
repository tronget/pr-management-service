services:
  db:
    image: postgres:15-alpine
    container_name: pr_management_db
    environment:
      POSTGRES_USER: pr_user
      POSTGRES_PASSWORD: pr_password
      POSTGRES_DB: pr_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pr_user -d pr_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pr_management_app
    environment:
      HTTP_ADDRESS: ":8080"
      DB_URL: "postgres://pr_user:pr_password@db:5432/pr_db?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data:

